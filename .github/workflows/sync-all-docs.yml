name: Sync All Docs

# Publica a documentacao de resources a partir das RECEITAS do mriTxRecipe, a
# fonte unica de verdade (regras em .release/ingest-docs.js):
#   - base.yaml           -> publica;
#   - so na beta.yaml     -> publica com "(beta)", se a variavel
#                            DOCS_PUBLISH_BETA deste repo nao for false;
#   - fora / sem MANUAL   -> nao publica e apaga a pagina.
#
# Gatilhos:
#   - repository_dispatch `update-manual`  : o MANUAL.md de um repo mudou
#     (callable-repo-dispatch). Atualiza so aquele slug.
#   - repository_dispatch `recipe-updated` : a receita mudou
#     (callable-recipe-release). Reconcilia tudo.
#   - schedule / workflow_dispatch         : reconcilia tudo (ou o CSV `only`).

on:
  workflow_dispatch:
    inputs:
      only:
        description: "CSV de repos para sincronizar (vazio = tudo das receitas)"
        required: false
  repository_dispatch:
    types: [update-manual, recipe-updated]
  schedule:
    - cron: "0 5 * * 1" # toda segunda-feira

# Commita as docs no proprio branch; o token padrao do repo e so leitura.
permissions:
  contents: write

# Varios repos podem avisar ao mesmo tempo. Serializa em vez de cancelar: cada
# aviso importa, e todos dao push no mesmo branch.
concurrency:
  group: docs-ingest
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Publicar documentacao
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DOCS_PUBLISH_BETA: ${{ vars.DOCS_PUBLISH_BETA }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PAYLOAD_SLUG: ${{ github.event.client_payload.slug || github.event.client_payload.repo }}
          ONLY: ${{ inputs.only }}
        run: |
          echo "DOCS_PUBLISH_BETA=${DOCS_PUBLISH_BETA:-<vazio: ligado>}"
          if [ "$EVENT" = "repository_dispatch" ] && [ "$ACTION" = "update-manual" ]; then
            node .release/ingest-docs.js "$PAYLOAD_SLUG"
          else
            node .release/ingest-docs.js "$ONLY"
          fi

      - name: Validar build
        run: npm run build

      - name: Commit e push se houver mudancas
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add -A content/docs/mri/resources/

          if git diff --cached --quiet; then
            echo "Sem mudancas para commitar."
            exit 0
          fi

          git commit -m "docs: sincroniza documentacao de resources com as receitas"

          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((i * 3))
          done
          exit 1
